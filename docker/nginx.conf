server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # mirror GitHub Pages: unknown paths get the kernel-panic 404 page
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # hashed build assets are immutable
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml application/rss+xml;
}
